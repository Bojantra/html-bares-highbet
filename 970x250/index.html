<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=970,height=250">
<title>HighBet Big Bass Splash 970x250</title>
<script>
// Click-through: the ad platform passes the destination as ?clickTag=...; the URL below is the fallback.
var clickTag = "https://www.highbet.com";
document.addEventListener('DOMContentLoaded', function () {
  var url = new URLSearchParams(location.search).get('clickTag');
  if (url && /^(https?:)?\/\//i.test(url)) clickTag = url;
  document.getElementById('ad').href = clickTag;
});
</script>
<style>
@font-face{font-family:'Zalando Sans Expanded';src:url(zalando-exp-black.woff2) format('woff2');font-weight:900;font-display:block}
@font-face{font-family:'Zalando Sans';src:url(zalando-medium.woff2) format('woff2');font-weight:500;font-display:block}
:root{--navy:#001841;--navy-2:#01346B;--cyan:#3ED7FE;--cyan-2:#1FB4F5}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:transparent}
#ad{position:relative;display:block;width:970px;height:250px;overflow:hidden;background:radial-gradient(circle at 80% 45%,#1670C4 0%,#06306E 42%,var(--navy) 100%);font-family:'Zalando Sans Expanded',Arial,Helvetica,sans-serif;font-weight:900;color:#fff;text-decoration:none;cursor:pointer;-webkit-font-smoothing:antialiased}
.panel{position:absolute;z-index:2;background:linear-gradient(90deg,var(--navy) 0%,var(--navy-2) 100%)}
.intro{position:absolute;left:50%;top:50%;z-index:3;opacity:0;transform:translate(-50%,-50%) scale(0)}
.cover{position:absolute;inset:0;z-index:3;background:linear-gradient(#0d3d70 0%,#0b2d59 45%,#0b2d59 100%)}
.intro img,.brand img,.hero img,.fish img{display:block;width:100%;height:auto}
.brand{position:absolute}
.hero{position:absolute;z-index:1}
.hero img{filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
.copy{position:absolute}
.s1,.s2,.s3{position:absolute;left:0;top:0;white-space:nowrap}
.fish{position:absolute}
.ln{display:block;overflow:hidden;line-height:1.1;padding-bottom:.06em;margin-bottom:-.06em;text-transform:uppercase}
.ln span{display:block;transform:translateY(110%)}
.c{color:#19C7FF}
.big,b{font-weight:900;letter-spacing:0}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:6px;background:linear-gradient(90deg,#00B6FF 0%,#0078FF 100%);color:#fff;font-weight:900;text-transform:uppercase;letter-spacing:0;white-space:nowrap;transform:scale(0)}
.btn::before,.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);transform:skewX(-20deg)}
.tc{position:absolute;z-index:4;color:rgba(255,255,255,.85);font-family:'Zalando Sans',Arial,Helvetica,sans-serif;font-weight:500;letter-spacing:0;line-height:1.25;white-space:nowrap}
#ad>*{transition:opacity .35s}
#ad.out>*:not(.tc){opacity:0}

/* timeline: logo intro -> offer -> game -> end card */
.play .intro{animation:intro 1.3s .15s both}
.play .cover{animation:fadeOut .4s 1.05s ease-in both}
.play .panel{animation:fadeIn .55s 1.25s cubic-bezier(.77,0,.18,1) both}
.play .brand{animation:pop .45s 1.7s cubic-bezier(.34,1.56,.64,1) both}
.play .hero{animation:heroIn .9s 1.6s cubic-bezier(.22,1,.36,1) both}
.play .hero img{animation:float 3.2s 2.6s ease-in-out infinite}
.play .fish{animation:pop .5s 4.9s cubic-bezier(.34,1.56,.64,1) both}
.play .fish img{animation:wiggle 1.6s 5.4s ease-in-out infinite}
.play .ln span{animation:lineUp .55s var(--d) cubic-bezier(.22,1,.36,1) both}
.play .s1{animation:sOut .4s 4.3s cubic-bezier(.64,0,.78,0) forwards}
.play .s2{animation:sOut .4s 6.8s cubic-bezier(.64,0,.78,0) forwards}
.play .btn{animation:pop .45s 3s cubic-bezier(.34,1.56,.64,1) both}
.play .btn::before{animation:shine 1.2s 3.6s ease-in-out}
.play .btn::after{animation:shine 1.2s 7.9s ease-in-out}

@keyframes intro{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  32%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.2)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes right{from{transform:translateX(-100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes heroIn{from{opacity:0;transform:translateX(30%) scale(.7) rotate(8deg)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:none}50%{transform:translateY(-3%) rotate(-1.5deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg) translateY(-6%)}}
@keyframes lineUp{from{transform:translateY(110%)}to{transform:none}}
@keyframes sOut{to{opacity:0;transform:translateY(-30%)}}
@keyframes shine{0%{left:-60%}100%{left:160%}}

/* bubbles: ambient stream + splash when the character lands */
.bubbles{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bubbles span,.fx span{position:absolute;border-radius:50%;border:1.5px solid rgba(25,199,255,.9);background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95) 0 14%,rgba(25,199,255,.25) 38%,rgba(25,199,255,.05) 70%);box-shadow:0 0 6px rgba(25,199,255,.45)}
.bubbles span{bottom:-20px;opacity:0;animation:rise linear infinite}
.fx{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fx span{left:0;top:0}
.done .bubbles{opacity:0}
.done .hero img{animation-play-state:paused}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:1}85%{opacity:.75}100%{transform:translate(var(--drift),calc(var(--rise) * -1));opacity:0}}

/* 970x250 layout */

.intro{width:320px}
.hero{left:600px;top:-30px;width:330px}
#ad{background:#00133B url(bg.jpg) 0 0/970px 250px no-repeat}
.panel{left:0;top:0;width:600px;height:100%;background:linear-gradient(90deg,rgba(0,19,59,.55) 0%,rgba(0,19,59,.45) 60%,rgba(0,19,59,0) 100%)}
.brand{left:40px;top:32px;width:140px}
.copy{left:40px;top:82px}
.s1,.s2,.s3{top:-8px}
.fish{left:250px;top:50px;width:64px}
.btn{left:40px;bottom:30px;width:160px;height:40px;font-size:14px}
.tc{left:40px;bottom:10px;font-size:8px}
</style>
</head>
<body>
<a id="ad" class="play" href="#" onclick="window.open(window.clickTag,'_blank');return false;">
  <div class="cover"></div>
  <div class="intro"><img src="highbet.webp" alt="HighBet"></div>
  <div class="bubbles" aria-hidden="true" data-zone="2,98" data-size="6,22" data-count="24" data-splash="14"></div>
  <div class="hero"><img src="hero.webp" alt="Big Bass Splash fisherman"></div>
  <div class="panel">
    <div class="brand"><img src="highbet.webp" alt="HighBet"></div>
    <div class="copy">
      <div class="s1"><span class="ln big" style="font-size:44px;--d:2.20s"><span>Get up to</span></span><span class="ln big" style="font-size:44px;--d:2.32s"><span><b class="c">300 cash spins</b></span></span></div>
      <div class="s2"><span class="ln big" style="font-size:44px;--d:4.65s"><span>On <b class="c">Big Bass</b></span></span><span class="ln big" style="font-size:44px;--d:4.77s"><span>Splash</span></span><div class="fish"><img src="fish.webp" alt=""></div></div>
      <div class="s3"><span class="ln c big" style="font-size:50px;--d:7.15s"><span>Aim high</span></span><span class="ln big" style="font-size:34px;--d:7.27s"><span>Join HighBet</span></span></div>
    </div>
    <div class="btn">Claim offer</div>
  </div>
  <div class="fx" aria-hidden="true"></div>
  <div class="tc">18+. UK only. New customers only. T&amp;Cs apply. GambleAware.org.</div>
</a>
<script>
(function () {
  var ad = document.getElementById('ad');
  var W = ad.offsetWidth, H = ad.offsetHeight;
  var box = ad.querySelector('.bubbles'), fx = ad.querySelector('.fx');
  var zone = box.getAttribute('data-zone').split(','), size = box.getAttribute('data-size').split(',');
  var z0 = +zone[0], z1 = +zone[1], s0 = +size[0], s1 = +size[1];
  var SPLASH = +box.getAttribute('data-splash');

  // Ambient bubbles rising through the scene.
  box.style.setProperty('--rise', (H + 40) + 'px');
  for (var i = 0, n = +box.getAttribute('data-count'); i < n; i++) {
    var b = document.createElement('span'), s = s0 + Math.random() * (s1 - s0);
    var dur = Math.max(2.5, (H + 40) / (45 + Math.random() * 50));
    b.style.width = b.style.height = s.toFixed(1) + 'px';
    b.style.left = (z0 + Math.random() * (z1 - z0)).toFixed(1) + '%';
    b.style.setProperty('--drift', (Math.random() * 30 - 15).toFixed(0) + 'px');
    b.style.animationDuration = dur.toFixed(2) + 's';
    b.style.animationDelay = (-Math.random() * dur).toFixed(2) + 's';
    box.appendChild(b);
  }

  // Small splash of bubbles when the character lands.
  function splash() {
    var h = ad.querySelector('.hero').getBoundingClientRect(), a = ad.getBoundingClientRect();
    var cx = Math.min(W - 10, Math.max(10, h.left - a.left + h.width / 2));
    var cy = Math.min(H - 10, Math.max(10, h.top - a.top + h.height * 0.55));
    var reach = Math.min(W, H);
    for (var i = 0; i < SPLASH; i++) {
      var p = document.createElement('span'), s = (s0 + Math.random() * (s1 - s0)) * 1.4;
      var ang = Math.random() * Math.PI * 2, d = reach * (0.15 + Math.random() * 0.3);
      p.style.width = p.style.height = s.toFixed(1) + 'px';
      p.style.left = (cx - s / 2) + 'px';
      p.style.top = (cy - s / 2) + 'px';
      fx.appendChild(p);
      p.animate([
        { transform: 'translate(0,0) scale(.3)', opacity: 1 },
        { transform: 'translate(' + (Math.cos(ang) * d).toFixed(1) + 'px,' + (Math.sin(ang) * d - reach * 0.15).toFixed(1) + 'px) scale(1)', opacity: 0 }
      ], { duration: 900 + Math.random() * 600, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = (function (el) {
        return function () { el.remove(); };
      })(p);
    }
  }

  // Plays 3 times in total (under 30s), then rests on the end card with all motion stopped.
  var plays = 1, MAX = 3, LEN = 9800, splashTimer = setTimeout(splash, 2400);
  function next() {
    ad.classList.add('out');
    setTimeout(function () {
      ad.classList.remove('play', 'out');
      void ad.offsetWidth;
      ad.classList.add('play');
      plays++;
      clearTimeout(splashTimer);
      splashTimer = setTimeout(splash, 2400);
      if (plays < MAX) setTimeout(next, LEN);
      else setTimeout(function () { ad.classList.add('done'); }, LEN - 1600);
    }, 400);
  }
  setTimeout(next, LEN);
})();
</script>
</body>
</html>
