<script>
    document.addEventListener("DOMContentLoaded", function () {
        const allButton = document.querySelector(".filter-btn:nth-child(1)");
        filterPromotions("all", allButton);
    });
    (function () {
        const allButton = document.querySelector(".filter-btn:nth-child(1)");
        filterPromotions("all", allButton);
    })();

    function filterPromotions(category, btn) {
        const cards = document.querySelectorAll(".card");
        const filterButtons = document.querySelectorAll(".filter-btn");

        // Highlight selected button
        filterButtons.forEach(button => button.classList.remove("selected"));
        btn.classList.add("selected");

        cards.forEach(card => {
            const categories = card.getAttribute("data-category").split(" ");
            // Split categories into array

            if (category === "all" || categories.includes(category)) {
                card.classList.remove("hidden");
            } else {
                card.classList.add("hidden");
            }
        });
    }
    window.filterPromotions = filterPromotions;
</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const cards = document.querySelectorAll(".card");
        cards.forEach(card => {
            if (!card.querySelector(".responsible-text")) {
                const disclaimer = document.createElement("div");
                disclaimer.classList.add("responsible-text");
                disclaimer.innerText = "18+ | Please gamble responsibly. BeGambleAware.org. T&Cs apply";
